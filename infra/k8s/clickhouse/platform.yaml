apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
  namespace: hospital-lake
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: hospital-lake
spec:
  selector:
    app: clickhouse
  ports:
  - name: p8123
    port: 8123
    targetPort: 8123
  - name: p9000
    port: 9000
    targetPort: 9000
  - name: metrics
    port: 9363
    targetPort: 9363
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: hospital-lake
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:25.8.18.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8123
        - containerPort: 9000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1536Mi
        envFrom:
        - configMapRef:
            name: hospital-config
        - secretRef:
            name: hospital-secrets
        env:
        - name: CLICKHOUSE_USER
          value: hospital_admin
        - name: CLICKHOUSE_PASSWORD
          value: $(CLICKHOUSE_ADMIN_PASSWORD)
        - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
          value: '1'
        volumeMounts:
        - name: clickhouse-data
          mountPath: /var/lib/clickhouse
        - name: clickhouse-metrics
          mountPath: /etc/clickhouse-server/config.d/prometheus.xml
          subPath: prometheus.xml
        readinessProbe:
          httpGet:
            path: /ping
            port: 8123
          periodSeconds: 5
          failureThreshold: 24
      volumes:
      - name: clickhouse-data
        persistentVolumeClaim:
          claimName: clickhouse-data
      - name: clickhouse-metrics
        configMap:
          name: clickhouse-metrics
  serviceName: clickhouse
