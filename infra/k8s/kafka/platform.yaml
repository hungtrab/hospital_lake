apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: combined
  namespace: hospital-lake
  labels:
    strimzi.io/cluster: hospital
spec:
  replicas: 1
  roles:
  - controller
  - broker
  storage:
    type: persistent-claim
    size: 3Gi
    deleteClaim: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  jvmOptions:
    -Xms: 384m
    -Xmx: 512m
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: hospital
  namespace: hospital-lake
spec:
  kafka:
    version: 4.1.0
    metadataVersion: 4.1-IV1
    listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false
      log.retention.hours: 24
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: metrics.yaml
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: hospital.events
  namespace: hospital-lake
  labels:
    strimzi.io/cluster: hospital
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 86400000
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: hospital.dlq
  namespace: hospital-lake
  labels:
    strimzi.io/cluster: hospital
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 86400000
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-metrics
  namespace: hospital-lake
spec:
  selector:
    strimzi.io/cluster: hospital
    strimzi.io/name: hospital-kafka
  ports:
  - name: metrics
    port: 9404
    targetPort: 9404
