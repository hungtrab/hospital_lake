apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: hospital-lake
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: hospital-lake
spec:
  selector:
    app: minio
  ports:
  - name: p9000
    port: 9000
    targetPort: 9000
  - name: p9001
    port: 9001
    targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: hospital-lake
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: hospital-lake/minio:RELEASE.2025-04-22T22-12-26Z
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9000
        - containerPort: 9001
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        envFrom:
        - configMapRef:
            name: hospital-config
        - secretRef:
            name: hospital-secrets
        env:
        - name: MINIO_ROOT_USER
          value: $(MINIO_ACCESS_KEY)
        - name: MINIO_ROOT_PASSWORD
          value: $(MINIO_SECRET_KEY)
        args:
        - server
        - /data
        - --console-address
        - :9001
        volumeMounts:
        - name: minio-data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          periodSeconds: 5
          failureThreshold: 24
      volumes:
      - name: minio-data
        persistentVolumeClaim:
          claimName: minio-data
  serviceName: minio
