apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: hospital-lake
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: hospital-lake
spec:
  selector:
    app: grafana
  ports:
  - name: p3000
    port: 3000
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: hospital-lake
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:12.2.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        envFrom:
        - configMapRef:
            name: hospital-config
        - secretRef:
            name: hospital-secrets
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: $(GRAFANA_ADMIN_USER)
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: $(GRAFANA_ADMIN_PASSWORD)
        - name: GF_PLUGINS_PREINSTALL
          value: grafana-clickhouse-datasource@4.22.1,trino-datasource@1.4.1
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-provider
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/hospital-dashboards
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 5
          failureThreshold: 24
      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-provider
        configMap:
          name: grafana-provider
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards
      securityContext:
        fsGroup: 472
