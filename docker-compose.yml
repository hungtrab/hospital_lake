name: hospital-lake

services:
  minio:
    image: ${MINIO_IMAGE:-hospital-lake/minio:RELEASE.2025-04-22T22-12-26Z}
    build:
      context: ./infra/docker/minio
    pull_policy: build
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Copy .env.example to .env first}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Copy .env.example to .env first}
      MINIO_REGION_NAME: ${MINIO_REGION:-us-east-1}
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    networks:
      - hospital-lake
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:9000/minio/health/ready']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  minio-init:
    image: ${MINIO_IMAGE:-hospital-lake/minio:RELEASE.2025-04-22T22-12-26Z}
    pull_policy: never
    entrypoint: ['/bin/sh', '/bootstrap.sh']
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Copy .env.example to .env first}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Copy .env.example to .env first}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-s3://warehouse/}
    volumes:
      - ./infra/docker/minio/bootstrap.sh:/bootstrap.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - hospital-lake
    restart: 'no'

  iceberg-rest:
    image: hospital-lake/iceberg-rest:1.9.0
    build:
      context: ./infra/docker/iceberg-rest
    pull_policy: build
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?Copy .env.example to .env first}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?Copy .env.example to .env first}
      AWS_REGION: ${MINIO_REGION:-us-east-1}
      CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-s3://warehouse/}
      CATALOG_URI: jdbc:sqlite:/var/lib/iceberg/catalog.db
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: 'true'
      JAVA_TOOL_OPTIONS: -Xmx384m
    ports:
      - '127.0.0.1:${ICEBERG_REST_PORT:-8181}:8181'
    volumes:
      - iceberg-catalog:/var/lib/iceberg
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8181/v1/config']
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 15s
    restart: unless-stopped
    mem_limit: 640m
    networks:
      - hospital-lake

  trino:
    image: trinodb/trino:483
    ports:
      - "127.0.0.1:${TRINO_PORT:-8080}:8080"
    environment:
      ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI:-http://iceberg-rest:8181}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    volumes:
      - ./infra/docker/trino/catalog:/etc/trino/catalog:ro
      - ./infra/docker/trino/config.properties:/etc/trino/config.properties:ro
      - ./infra/docker/trino/jvm.config:/etc/trino/jvm.config:ro
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "trino", "--server", "http://localhost:8080", "--execute", "SELECT 1", "--output-format", "NULL"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - hospital-lake
    depends_on:
      iceberg-rest:
        condition: service_healthy

  # Optional speed layer: batch-only `make up` does not start Kafka.
  kafka:
    image: apache/kafka:3.9.1
    profiles: ['kafka']
    environment:
      CLUSTER_ID: hospitalLakeKraftLocal1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 67108864
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_HEAP_OPTS: '-Xms256m -Xmx512m'
    ports:
      - '127.0.0.1:${KAFKA_PORT:-9092}:9092'
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ['CMD', '/opt/kafka/bin/kafka-topics.sh', '--bootstrap-server', 'kafka:29092', '--list']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - hospital-lake

  kafka-init:
    image: apache/kafka:3.9.1
    profiles: ['kafka']
    entrypoint: ['/bin/sh', '/bootstrap-topics.sh']
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_HEAP_OPTS: '-Xms64m -Xmx128m'
    volumes:
      - ./infra/docker/kafka/bootstrap-topics.sh:/bootstrap-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 256m
    restart: 'no'
    networks:
      - hospital-lake

  spark-smoke:
    image: apache/spark:3.5.5-python3
    profiles: ['smoke']
    working_dir: /opt/hospital-lake
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Copy .env.example to .env first}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Copy .env.example to .env first}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-s3://warehouse/}
      SPARK_MASTER: local[1]
      PYTHONPATH: /opt/hospital-lake
    volumes:
      - .:/opt/hospital-lake:ro
      # /tmp already exists with mode 1777 in the upstream image; Spark's
      # non-root user can create the ivy subdirectory in a fresh named volume.
      - spark-ivy:/tmp
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --driver-memory
      - 512m
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - --packages
      - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.9.0,org.apache.iceberg:iceberg-aws-bundle:1.9.0
      - tests/integration/spark_iceberg_smoke.py
    mem_limit: 1280m
    depends_on:
      iceberg-rest:
        condition: service_healthy
    networks:
      - hospital-lake

  bronze-bootstrap:
    extends:
      service: spark-smoke
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --driver-memory
      - 512m
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - --packages
      - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.9.0,org.apache.iceberg:iceberg-aws-bundle:1.9.0
      - scripts/bootstrap_bronze.py

  bronze-ingest:
    extends:
      service: spark-smoke
    volumes:
      - type: bind
        source: ${BRONZE_INPUT_DIR:-./data/generated}
        target: /opt/hospital-input
        read_only: true
        bind:
          create_host_path: false
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --driver-memory
      - 512m
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - --packages
      - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.9.0,org.apache.iceberg:iceberg-aws-bundle:1.9.0
      - spark/batch/ingest_bronze.py

  silver-transform:
    extends:
      service: spark-smoke
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --driver-memory
      - 512m
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - --packages
      - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.9.0,org.apache.iceberg:iceberg-aws-bundle:1.9.0
      - spark/batch/bronze_to_silver.py

  gold:
    extends:
      service: spark-smoke
    environment:
      # Defaults match generators/batch_generator/config.yaml (end_date) and the
      # five canonical departments; override in .env.
      GOLD_AS_OF: ${GOLD_AS_OF:-2026-09-01T00:00:00Z}
      GOLD_BED_CAPACITIES: ${GOLD_BED_CAPACITIES:-ICU=20,EMERGENCY=40,CARDIOLOGY=50,INTERNAL_MEDICINE=60,SURGERY=50}
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --driver-memory
      - 512m
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - --packages
      - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.9.0,org.apache.iceberg:iceberg-aws-bundle:1.9.0
      - spark/batch/silver_to_gold.py

  bronze-smoke:
    extends:
      service: bronze-bootstrap
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --driver-memory
      - 512m
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - --packages
      - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.9.0,org.apache.iceberg:iceberg-aws-bundle:1.9.0
      - tests/integration/bronze_contract_smoke.py

  stream-bronze:
    extends:
      service: spark-smoke
    profiles: ['stream']
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${STREAM_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      KAFKA_TOPICS: ${KAFKA_TOPICS:-hospital.events}
      KAFKA_STARTING_OFFSETS: ${KAFKA_STARTING_OFFSETS:-latest}
      STREAM_CHECKPOINT_LOCATION: ${STREAM_CHECKPOINT_LOCATION_DOCKER:-/tmp/checkpoints/stream-bronze}
    volumes:
      # This replaces spark-ivy:/tmp for this service. The image's /tmp is
      # mode 1777, so its non-root Spark user can write Ivy and checkpoint data.
      - stream-state:/tmp
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --driver-memory
      - 512m
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - --packages
      - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.9.0,org.apache.iceberg:iceberg-aws-bundle:1.9.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.5
      # Already in /opt/spark/jars; skipping them avoids ~55 MB of first-start downloads.
      - --exclude-packages
      - org.apache.hadoop:hadoop-client-runtime,org.apache.hadoop:hadoop-client-api,org.lz4:lz4-java,org.xerial.snappy:snappy-java,org.slf4j:slf4j-api,commons-logging:commons-logging,com.google.code.findbugs:jsr305
      - spark/streaming/kafka_to_bronze.py

volumes:
  kafka-data:
  minio-data:
  iceberg-catalog:
  spark-ivy:
  stream-state:

networks:
  hospital-lake:
