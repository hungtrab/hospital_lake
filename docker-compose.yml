name: hospital-lake

services:
  minio:
    image: ${MINIO_IMAGE:-hospital-lake/minio:RELEASE.2025-04-22T22-12-26Z}
    build:
      context: ./infra/docker/minio
    pull_policy: build
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Copy .env.example to .env first}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Copy .env.example to .env first}
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    networks:
      - hospital-lake
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:9000/minio/health/ready']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  trino:
    image: trinodb/trino:483
    ports:
      - "127.0.0.1:${TRINO_PORT:-8080}:8080"
    environment:
      ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI:-http://iceberg-rest:8181}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    volumes:
      - ./infra/docker/trino/catalog:/etc/trino/catalog:ro
      - ./infra/docker/trino/config.properties:/etc/trino/config.properties:ro
      - ./infra/docker/trino/jvm.config:/etc/trino/jvm.config:ro
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "trino", "--server", "http://localhost:8080", "--execute", "SELECT 1", "--output-format", "NULL"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - hospital-lake

volumes:
  minio-data:

networks:
  hospital-lake:
